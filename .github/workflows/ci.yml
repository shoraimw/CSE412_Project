name: DRIVE CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/drive-end-to-end-completion-20261128

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies
        run: npm install --no-audit --no-fund
      - name: Build backend and validate Worker bundle
        run: npm run build
      - name: Frontend and route smoke checks
        run: npm run smoke

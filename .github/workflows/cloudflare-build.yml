name: Cloudflare Workers build validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'cloudflare.config.ts'
      - 'vite.config.ts'
      - 'package.json'
      - '.github/workflows/cloudflare-build.yml'
  push:
    branches: [feature/uber-style-platform]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'cloudflare.config.ts'
      - 'vite.config.ts'
      - 'package.json'
      - '.github/workflows/cloudflare-build.yml'
jobs:
  cloudflare-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

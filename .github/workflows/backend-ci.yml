name: DRIVE backend CI
on:
  pull_request:
    branches: [main]
    paths: ['backend/**', 'supabase/**', '.github/workflows/backend-ci.yml']
  push:
    branches: [feature/drive-full-platform]
    paths: ['backend/**', 'supabase/**', '.github/workflows/backend-ci.yml']
jobs:
  backend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

name: DRIVE validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        run: npm install
        working-directory: backend

      - name: Type-check backend
        run: npm run typecheck
        working-directory: backend

      - name: Build NestJS backend for Vercel
        run: npm run build
        working-directory: backend

      - name: Validate frontend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find frontend/js -type f -name '*.js' -print0)

      - name: Validate Vercel API entrypoint
        run: node --check 'api/[...path].js'

      - name: Validate Vercel configuration
        run: node --input-type=module -e "import { readFileSync } from 'node:fs'; JSON.parse(readFileSync('vercel.json', 'utf8'));"

      - name: Ensure no server-only Supabase key is exposed in frontend
        shell: bash
        run: |
          if grep -R --line-number --exclude='*.map' 'SUPABASE_SERVICE_ROLE_KEY\|service_role' frontend; then
            echo 'A server-only Supabase key or role marker was found in frontend assets.'
            exit 1
          fi

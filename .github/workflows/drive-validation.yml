name: DRIVE validation

on:
  push:
    branches: [main, rebuild/drive-clean-ui-20261128]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root deployment dependencies
        run: npm install --no-audit --no-fund

      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
        working-directory: backend

      - name: Type-check backend
        run: npm run typecheck
        working-directory: backend

      - name: Build NestJS backend
        run: npm run build
        working-directory: backend

      - name: Validate frontend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find frontend/js -type f -name '*.js' -print0)

      - name: Validate Vercel API adapter and configuration
        run: |
          node --check 'api/[...path].js'
          node --input-type=module -e "import { readFileSync } from 'node:fs'; JSON.parse(readFileSync('vercel.json', 'utf8'));"

      - name: Validate application assets
        run: npm run smoke

      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run

      - name: Ensure no server-only Supabase key is exposed in frontend
        shell: bash
        run: |
          if grep -R --line-number --exclude='*.map' 'SUPABASE_SERVICE_ROLE_KEY\\|service_role' frontend; then
            echo 'A server-only Supabase key or role marker was found in frontend assets.'
            exit 1
          fi

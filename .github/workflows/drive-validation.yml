name: DRIVE validation

on:
  push:
    branches:
      - main
      - feature/drive-end-to-end-completion-20261128
      - gpt/drive-functional-fixes-20261128
  pull_request:
    branches:
      - main
      - feature/drive-end-to-end-completion-20261128
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm install --no-audit --no-fund

      - name: Build, type-check, smoke-test and validate Cloudflare Worker
        run: npm run build

      - name: Validate frontend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find frontend/js -type f -name '*.js' -print0)

      - name: Ensure server-only Supabase credentials are not exposed
        shell: bash
        run: |
          if grep -R --line-number --exclude='*.map' 'SUPABASE_SERVICE_ROLE_KEY' frontend; then
            echo 'A server-only Supabase credential reference was found in frontend assets.'
            exit 1
          fi

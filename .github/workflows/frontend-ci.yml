name: DRIVE frontend validation
on:
  pull_request:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']
  push:
    branches: [feature/uber-style-platform]
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']
jobs:
  frontend-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          find frontend/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

name: Deploy DRIVE to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - '.github/workflows/cloudflare-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate admin dashboard JavaScript
        run: |
          node --check frontend/js/admin.js
          node --check frontend/js/api.js
          node --check frontend/js/driver-apply.js
          node --check frontend/js/driver.js
          node --check frontend/js/notifications.js
      - name: Validate Cloudflare bundle
        run: npm run build
      - name: Deploy to Cloudflare Workers
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 0f20ed886931ae4004982c7112f42636
          command: deploy
      - name: Explain skipped deployment
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::notice::Add the CLOUDFLARE_API_TOKEN repository secret, then run this workflow again to deploy DRIVE."

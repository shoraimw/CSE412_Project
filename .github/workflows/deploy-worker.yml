name: Archived — duplicate Worker deployment disabled

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain current deployment pipeline
        run: |
          echo "This duplicate Worker deployment workflow is retired to prevent two production deployments for one main-branch push."
          echo "The active production Worker workflow is .github/workflows/cloudflare-deploy.yml."
          echo "Cloudflare Pages Git integration handles the static frontend and preview deployments."

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DRIVE — My Profile</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/api.js" defer></script><script src="js/user.js" defer></script>
</head>
<body>
<header class="topbar"><a class="brand" href="index.html">DRIVE</a><nav><a href="dashboard.html">Dashboard</a><a href="vehicles.html">Vehicle Rental</a><button id="logoutButton" class="nav-button" type="button">Logout</button></nav></header>
<main class="form-wrap"><section class="panel form-panel">
  <p class="eyebrow">USER MANAGEMENT</p><h1>My Profile</h1>
  <form id="profileForm">
    <label>Full Name<input type="text" id="profileName" name="name" required maxlength="80"></label>
    <label>Email Address<input type="email" id="profileEmail" disabled></label>
    <label>Phone Number<input type="tel" id="profilePhone" name="phone" maxlength="30"></label>
    <label>Account Role<input type="text" id="profileRole" disabled aria-describedby="roleNote"></label>
    <p class="small-note" id="roleNote">Role changes require verification and cannot be self-assigned.</p>
    <button type="submit" class="button">Save Changes</button><p id="profileMessage" class="message" aria-live="polite"></p>
  </form>
  <p class="small-note">Profile data is currently held in temporary demo storage. Persistent database setup is required before production use.</p>
</section></main><footer>DRIVE · CSE412 Academic Project</footer>
</body></html>

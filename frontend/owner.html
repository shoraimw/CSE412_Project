<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DRIVE · Vehicle Owner</title><link rel="stylesheet" href="css/drive.css"><style>
.owner-wrap{width:min(1100px,calc(100% - 36px));margin:40px auto 80px}.owner-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:18px}.owner-card{background:#fff;border:1px solid #e8edf0;border-radius:18px;padding:22px}.owner-card h2{font:800 20px Manrope;margin:0 0 8px}.owner-card p{font-size:12px;color:#718078}.owner-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.owner-form label{font-size:11px;font-weight:700;color:#66736d}.owner-form input,.owner-form select,.owner-form textarea{width:100%;box-sizing:border-box;margin-top:6px;padding:11px;border:1px solid #dfe6e1;border-radius:9px;font:13px 'DM Sans'}.owner-form .wide{grid-column:1/-1}.owner-form button{grid-column:1/-1}.owner-list{display:grid;gap:12px}.owner-item{border:1px solid #edf0eb;border-radius:12px;padding:14px}.owner-item strong{font-size:14px}.owner-item small{display:block;color:#718078;margin-top:6px}.owner-item select{padding:7px;border-radius:8px;border:1px solid #dfe6e1;margin-top:10px}@media(max-width:760px){.owner-grid{grid-template-columns:1fr}.owner-form{grid-template-columns:1fr}.owner-form .wide,.owner-form button{grid-column:auto}}
</style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">D</span>DRIVE<span class="brand-dot">.</span></a><nav class="nav-links"><a href="vehicles.html">Public rentals</a><a href="dashboard.html">Passenger dashboard</a></nav><div class="nav-actions"><button id="ownerLogout" class="dash-logout">Log out</button></div></header><main class="owner-wrap"><span class="eyebrow">VEHICLE OWNER WORKSPACE</span><h1>Manage your fleet</h1><p id="ownerMessage" class="driver-message" aria-live="polite">Loading your owner workspace…</p><div class="owner-grid"><section class="owner-card"><h2>List a vehicle</h2><p>New listings stay private until an administrator verifies them.</p><form id="vehicleForm" class="owner-form">
<label>Make<input name="make" required maxlength="80" placeholder="Toyota"></label><label>Model<input name="model" required maxlength="100" placeholder="Axio"></label>
<label>Vehicle type<select name="vehicle_type"><option value="car">Car</option><option value="bike">Bike</option><option value="scooter">Scooter</option><option value="van">Van</option><option value="other">Other</option></select></label><label>Registration / Plate<input name="plate_number" required maxlength="30"></label>
<label>City<input name="city" value="Dhaka" required></label><label>Seats<input name="seats" type="number" min="1" max="60" value="4"></label>
<label>Price per day (৳)<input name="price_per_day" type="number" min="0" step="0.01"></label><label>Price per km (৳)<input name="price_per_km" type="number" min="0" step="0.01"></label>
<label>Model year<input name="model_year" type="number" min="1980" max="2100"></label><label>Color<input name="color"></label>
<label class="wide">Description<textarea name="description" rows="3" maxlength="1000"></textarea></label><label class="wide">Photo URLs (comma separated)<input name="photo_paths" placeholder="https://..."></label>
<button class="button button-accent" type="submit">Submit vehicle for verification</button></form></section>
<section class="owner-card"><h2>Your vehicles</h2><div id="ownerVehicles" class="owner-list"></div><h2 style="margin-top:26px">Rental requests</h2><div id="ownerBookings" class="owner-list"></div></section></div></main><script src="js/api.js"></script><script src="js/owner.js"></script></body></html>

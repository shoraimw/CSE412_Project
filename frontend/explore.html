<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explore Bangladesh · DRIVE</title><link rel="stylesheet" href="css/drive.css"></head><body><header class="topbar"><a class="brand" href="index.html">DRIVE<span class="brand-period">.</span></a><nav class="main-nav"><a href="index.html">Ride</a><a href="vehicles.html">Rentals</a><a class="active" href="explore.html">Explore</a><a href="dashboard.html">My trips</a></nav><div class="top-actions"><a class="nav-login" href="login.html">Log in</a></div></header><main class="page-shell"><p class="eyebrow">TOURIST MODE</p><h1 class="page-title">Make a day of it.</h1><p class="page-subtitle">Discover places and save a simple travel plan.</p><section class="card" style="margin-bottom:18px"><form id="exploreFilters" class="form-grid"><div class="form-field"><label for="exploreCity">City</label><select id="exploreCity"><option>Dhaka</option><option>Chattogram</option><option>Cox's Bazar</option><option>Sylhet</option></select></div><div class="form-field"><label for="exploreInterest">Interest</label><select id="exploreInterest"><option value="">All interests</option><option value="history">History</option><option value="nature">Nature</option><option value="beach">Beach</option><option value="culture">Culture</option></select></div><div class="form-field"><label for="travelDate">Travel date</label><input id="travelDate" type="date"></div><div class="form-field"><label for="transport">Transport</label><select id="transport"><option>Car</option><option>Bike</option><option>Public Transport</option><option>Walking</option></select></div><div class="form-field full"><button class="button button-dark" type="submit">Find places</button></div></form></section><div class="toolbar"><h2 class="card-title">Places to explore</h2><span class="muted small" id="placeCount"></span></div><section id="placesGrid" class="vehicle-grid"><div class="empty-state">Loading places…</div></section><section class="card" style="margin-top:20px"><div class="toolbar"><h2 class="card-title">Your saved plans</h2><button class="button button-outline button-small" id="savePlan">Save selected places</button></div><div class="message" id="planMessage"></div><div id="savedPlans" class="list"><div class="empty-state">Log in to view saved plans.</div></div></section></main><script src="js/api.js"></script><script src="js/explore.js"></script></body></html>

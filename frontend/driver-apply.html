<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DRIVE · Become a Driver</title><link rel="stylesheet" href="css/drive.css"><style>.apply-wrap{width:min(760px,calc(100% - 36px));margin:45px auto}.apply-card{background:#fff;border:1px solid #e8edf0;border-radius:18px;padding:24px}.apply-form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.apply-form label{font-size:12px;font-weight:700;color:#65716a}.apply-form input,.apply-form select,.apply-form textarea{width:100%;box-sizing:border-box;margin-top:7px;padding:12px;border:1px solid #dfe6e1;border-radius:9px}.apply-form .wide,.apply-form button{grid-column:1/-1}.apply-status{padding:12px;background:#f4f7f1;border-radius:10px;margin-top:14px;font-size:13px}@media(max-width:600px){.apply-form{grid-template-columns:1fr}.apply-form .wide,.apply-form button{grid-column:auto}}</style></head><body><header class="topbar"><a class="brand" href="index.html">DRIVE<span class="brand-dot">.</span></a><nav class="nav-links"><a href="dashboard.html">Dashboard</a><a href="driver.html">Driver workspace</a></nav></header><main class="apply-wrap"><span class="eyebrow">DRIVE PARTNER PROGRAM</span><h1>Become a verified driver</h1><p>Submit your details. An administrator reviews the application before driver access is enabled.</p><section class="apply-card"><form id="applicationForm" class="apply-form"><label>Verification type<select name="verification_type" required><option value="driving_license">Driving licence</option><option value="national_id">National ID (NID)</option></select></label><label>NID / Driving licence number<input name="license_number" required minlength="5" maxlength="70" autocomplete="off" placeholder="Enter your identification number"></label><label>Years of experience <span>(optional)</span><input name="experience_years" type="number" min="0" max="60" value="0"></label><label>Vehicle type <span>(optional)</span><select name="requested_vehicle_type"><option value="bike">Bike</option><option value="car">Car</option><option value="cng">CNG</option></select></label><label class="wide">Additional note <span>(optional)</span><textarea name="note" rows="3" maxlength="500"></textarea></label><button class="button button-accent" type="submit">Submit application</button></form><div id="applicationStatus" class="apply-status" aria-live="polite"></div></section></main><script src="js/api.js"></script><script src="js/driver-apply.js"></script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DRIVE — Create account</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/api.js" defer></script><script src="js/auth.js" defer></script>
</head>
<body>
  <header class="topbar"><a class="brand" href="index.html">DRIVE</a><nav><a href="login.html">Login</a><a href="vehicles.html">Vehicle Rental</a></nav></header>
  <main class="form-wrap"><section class="panel form-panel">
    <p class="eyebrow">AUTHENTICATION & SECURITY</p><h1>Create your account</h1>
    <p class="small-note">New accounts start as Passenger. Driver and Vehicle Owner access requires a separate verification process.</p>
    <form id="registerForm">
      <label>Full Name<input type="text" name="name" required maxlength="80" autocomplete="name" placeholder="Enter your full name"></label>
      <label>Email Address<input type="email" name="email" required autocomplete="email" placeholder="Enter your email"></label>
      <label>Phone Number<input type="tel" name="phone" maxlength="30" autocomplete="tel" placeholder="Enter your phone number"></label>
      <label>Password<input type="password" name="password" minlength="8" maxlength="72" required autocomplete="new-password" placeholder="At least 8 characters"></label>
      <button type="submit" class="button">Create account</button><p id="registerMessage" class="message" aria-live="polite"></p>
    </form>
    <p>Already have an account? <a href="login.html">Log in</a></p>
  </section></main><footer>DRIVE · CSE412 Academic Project</footer>
</body></html>

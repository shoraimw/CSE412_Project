<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f8f7"><title>Sign in · DRIVE</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="js/api.js" defer></script><script src="js/auth.js" defer></script></head>
<body class="auth-page"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">D</span>DRIVE<span class="brand-dot">.</span></a><nav><a href="register.html">Create account</a><a href="vehicles.html">Explore rentals</a></nav></header>
<main class="form-wrap"><section class="panel form-panel auth-panel"><span class="eyebrow">WELCOME BACK</span><h1>Good to see you again.</h1><p class="auth-intro">Sign in to book a ride, manage your journeys and travel with confidence.</p>
<form id="loginForm" novalidate><label>Email address<input type="email" name="email" required maxlength="254" autocomplete="username" placeholder="you@example.com"></label><label>Password<span class="password-field"><input id="loginPassword" type="password" name="password" required autocomplete="current-password" placeholder="Enter your password"><button class="password-toggle" type="button" data-password-toggle="loginPassword" aria-label="Show password" aria-pressed="false"><svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a15 15 0 0 1-3 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1 0 1.9-.2 2.8-.5"/></svg></button></span></label><button type="submit" class="button auth-submit">Sign in <span>→</span></button><p id="loginMessage" class="message" role="status" aria-live="polite"></p></form><div class="otp-divider"><span>OR</span></div><button type="button" id="otpModeToggle" class="otp-mode-toggle">Sign in with an email code instead</button><section id="emailOtpPanel" class="email-otp-panel" hidden><p class="otp-description">We'll send a one-time code to your registered email address.</p><label>Email address<input id="otpEmail" type="email" autocomplete="email" placeholder="you@example.com"></label><button type="button" id="sendOtpButton" class="button auth-submit">Send sign-in code</button><label>6-digit verification code<input id="otpCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000"></label><button type="button" id="verifyOtpButton" class="button auth-submit">Verify & sign in →</button><p id="otpMessage" class="message" role="status" aria-live="polite"></p></section><p class="auth-switch">New to DRIVE? <a href="register.html">Create an account</a></p></section></main><footer>DRIVE · East West University · CSE412</footer></body></html>
